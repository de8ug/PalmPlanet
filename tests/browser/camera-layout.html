<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PalmPlanet 布局检查</title><style>body{font:16px sans-serif}iframe{width:1100px;height:720px;border:1px solid #aaa}button{padding:12px}output{display:block;margin:10px}</style><h1>摄像头布局检查（合成图案，无真人画面）</h1><p>仅生成测试图案并接到同源试玩页面的视频元素，不调用摄像头。</p><button id="start">生成测试视频流</button><button id="stop">停止测试视频流</button><output id="result">等待操作</output><iframe id="frame" src="/"></iframe><script type="module">
let stream, animation;
const frame = document.querySelector('#frame'), output = document.querySelector('#result');
document.querySelector('#start').onclick = async () => {
  stream?.getTracks().forEach(t=>t.stop()); cancelAnimationFrame(animation);
  const canvas=document.createElement('canvas');canvas.width=640;canvas.height=480;
  const ctx=canvas.getContext('2d');
  function draw(){ctx.fillStyle='#28696d';ctx.fillRect(0,0,640,480);ctx.fillStyle='#dbb891';ctx.beginPath();ctx.arc(320,160,65,0,Math.PI*2);ctx.fill();ctx.fillStyle='#163849';ctx.fillRect(230,235,180,240);ctx.fillStyle='white';ctx.font='20px sans-serif';ctx.fillText('SYNTHETIC TEST · NO CAMERA',35,40);animation=requestAnimationFrame(draw)}draw();
  stream=canvas.captureStream(8);
  const doc=frame.contentDocument;const source=doc.querySelector('#camera-video');
  source.srcObject=stream;doc.querySelector('#camera-panel').hidden=false;await source.play();
  output.textContent='合成视频已连接。请在下方页面切换人物画面模式。';
};
document.querySelector('#stop').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(animation);const doc=frame.contentDocument;doc.querySelector('#camera-video').srcObject=null;doc.querySelector('#camera-stop').click();output.textContent='合成视频已停止，背景应隐藏。'};
window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(animation)});
</script></html>
